services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-please-change}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:${HOST_PORT:-3000}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_ROOT: /app/storage
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - ./storage:/app/storage
    restart: unless-stopped
    init: true

volumes:
  postgres-data:
